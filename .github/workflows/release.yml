name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Empty until the SignPath Foundation application is approved and the
      # secret is added; every signing step is skipped while it is empty, so
      # releases ship unsigned rather than failing.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch runs on main by default; always build the tagged commit.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/YTile.Tests -c Release

      # Separate steps: pwsh run blocks only propagate the LAST command's exit
      # code, which would let a failed ytiled publish slip through to Smoke-test.
      # -p:Version stamps the PE version resource from the tag; SignPath's
      # artifact configuration restricts signing on the PE product name
      # (Product=YTile), and the smoke test below enforces the version.
      - name: Publish ytiled (NativeAOT)
        run: dotnet publish src/YTile -r win-x64 -c Release -o publish -p:Version=$($env:TAG.TrimStart('v'))

      - name: Publish ytile (NativeAOT)
        run: dotnet publish src/YTile.Cli -r win-x64 -c Release -o publish -p:Version=$($env:TAG.TrimStart('v'))

      # A binary that cannot report its own version — or reports one that does
      # not match the tag — is not shippable.
      - name: Smoke-test
        run: |
          $version = $env:TAG.TrimStart('v')
          foreach ($exe in 'ytiled', 'ytile') {
            $reported = (& "./publish/$exe.exe" --version) -join ''
            if ($LASTEXITCODE -ne 0) {
              throw "$exe.exe --version exited with $LASTEXITCODE"
            }
            Write-Host $reported
            if ($reported -ne "$exe $version") {
              throw "$exe.exe reports '$reported' but the tag says '$exe $version' — bump the Version const before tagging."
            }
            # The PE version resource must match too — this check is the only
            # gate enforcing it (SignPath pins only the product name).
            $pv = (Get-Item "./publish/$exe.exe").VersionInfo.ProductVersion
            if ($pv -ne $version -and -not $pv.StartsWith("$version+")) {
              throw "$exe.exe PE ProductVersion is '$pv', expected '$version' — was -p:Version dropped from the publish step?"
            }
          }

      # --- Code signing (SignPath Foundation) -------------------------------
      # Signs ytiled.exe and ytile.exe in place before anything downstream
      # (zip, checksums, winget manifests) sees them. The submit step blocks
      # until the signing request is manually approved at app.signpath.io —
      # that approval is a SignPath Foundation requirement, not a choice.
      # Setup runbook: packaging/signpath/README.md.
      - name: Upload unsigned binaries
        if: env.SIGNPATH_API_TOKEN != ''
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-binaries
          path: |
            publish/ytiled.exe
            publish/ytile.exe
          retention-days: 1

      - name: Sign binaries (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ytile
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Leave time for a human to approve the request in the SignPath UI.
          wait-for-completion-timeout-in-seconds: '3600'
          output-artifact-directory: publish/signed

      - name: Replace binaries with signed ones
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          Copy-Item publish/signed/ytiled.exe, publish/signed/ytile.exe -Destination publish -Force
          $version = $env:TAG.TrimStart('v')
          foreach ($exe in 'ytiled', 'ytile') {
            $sig = Get-AuthenticodeSignature "publish/$exe.exe"
            if ($sig.Status -ne 'Valid') {
              throw "$exe.exe signature status is $($sig.Status)"
            }
            Write-Host "$exe.exe signed by: $($sig.SignerCertificate.Subject)"
            # Signing must not have broken the binary.
            $reported = (& "./publish/$exe.exe" --version) -join ''
            if ($LASTEXITCODE -ne 0 -or $reported -ne "$exe $version") {
              throw "$exe.exe failed to run after signing (reported '$reported')"
            }
          }
      # ----------------------------------------------------------------------

      # ykeys is its own project (github.com/AegiosOT/YKeys) but ships inside
      # the YTile zip so hotkeys work out of the box. Pinned by version AND
      # hash: a retagged upstream release must fail loudly here, not ship.
      - name: Bundle ykeys
        env:
          YKEYS_VERSION: '0.1.1'
          YKEYS_SHA256: 391ddc0c9066dce5bab0b59876569e39a62829fc5a6572432827375fa81b61c6
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest "https://github.com/AegiosOT/YKeys/releases/download/v$env:YKEYS_VERSION/ykeys.exe" -OutFile publish/ykeys.exe
          $hash = (Get-FileHash publish/ykeys.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:YKEYS_SHA256) {
            throw "ykeys.exe hash mismatch: got $hash, pinned $env:YKEYS_SHA256"
          }
          $reported = (& ./publish/ykeys.exe --version) -join ''
          if ($LASTEXITCODE -ne 0 -or $reported -ne "ykeys $env:YKEYS_VERSION") {
            throw "bundled ykeys.exe reports '$reported', expected 'ykeys $env:YKEYS_VERSION'"
          }
          Write-Host "bundled $reported ($hash)"

      # The zip is the winget installer asset (InstallerType: zip, nested portable).
      - name: Package zip
        run: |
          $version = $env:TAG.TrimStart('v')
          Compress-Archive -Path publish/ytiled.exe, publish/ytile.exe, publish/ykeys.exe, LICENSE -DestinationPath "publish/ytile-$version-win-x64.zip"

      # The installer refuses to install a binary whose hash does not match.
      - name: Checksums
        run: |
          $version = $env:TAG.TrimStart('v')
          cd publish
          Get-FileHash ytiled.exe, ytile.exe, ykeys.exe, "ytile-$version-win-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      # Manifests must carry the hash of the exact zip the release serves, so
      # they are generated here and attached to the release; the winget-pkgs
      # submission uses them as-is.
      - name: Winget manifests
        run: |
          $version = $env:TAG.TrimStart('v')
          pwsh scripts/winget-manifests.ps1 -Version $version -ZipPath "publish/ytile-$version-win-x64.zip" -OutDir publish/winget

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $assets = @(
            'publish/ytiled.exe'
            'publish/ytile.exe'
            'publish/ykeys.exe'
            "publish/ytile-$version-win-x64.zip"
            'publish/SHA256SUMS.txt'
          ) + (Get-ChildItem publish/winget/*.yaml).FullName
          # Idempotent: a re-run after a partial failure (gh creates the release,
          # then uploads assets) must replace the assets, not die on 'already exists'.
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber
            # A failed upload must not be masked by the edit below going green —
            # that would publish a release whose assets are missing or stale.
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # A cancelled create can orphan a DRAFT release, which `view` still
            # finds; drafts serve no assets and hide from /releases/latest.
            gh release edit $env:TAG --draft=false
          } else {
            gh release create $env:TAG @assets --title "YTile $env:TAG" --generate-notes
          }
